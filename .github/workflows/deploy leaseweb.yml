name: Deploy EESU Dashboard to Leaseweb

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_DIR: /home/ubuntu/EESU_Dashboard
      DASHBOARD_PORT: 8501
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL }}

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v3

      # 2. Detect environment
      - name: Set ENV
        run: |
          if [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "ENV=staging" >> $GITHUB_ENV
          else
            echo "ENV=production" >> $GITHUB_ENV
          fi

      # 3. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LEASEWEB_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 4. Deploy Dashboard
      - name: Deploy Dashboard
        id: deploy
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.LEASEWEB_SERVER_IP }} << EOF
            set -e
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/kyalorichard/EESU_Dashboard.git $APP_DIR
            else
              cd $APP_DIR
              git reset --hard
              git pull
            fi

            cd $APP_DIR

            # Build Docker image
            docker build -t eesu-dashboard .

            # Backup existing container
            docker tag eesu-dashboard eesu-dashboard:backup || true

            # Stop and remove current container
            docker stop eesu-dashboard || true
            docker rm eesu-dashboard || true

            # Run new container
            docker run -d -p $DASHBOARD_PORT:$DASHBOARD_PORT --name eesu-dashboard \
              -e ENV=$ENV \
              eesu-dashboard

            # Health check
            sleep 20
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$DASHBOARD_PORT)
            if [ "$STATUS" != "200" ]; then
              echo "Deploy failed, rolling back..."
              docker stop eesu-dashboard || true
              docker rm eesu-dashboard || true
              docker run -d -p $DASHBOARD_PORT:$DASHBOARD_PORT --name eesu-dashboard eesu-dashboard:backup
              exit 1
            fi
EOF

      # 5. Send Success Email
      - name: Send Deployment Success Email
        if: success()
        run: |
          python3 - <<PYTHON
import smtplib
from email.message import EmailMessage
msg = EmailMessage()
msg['Subject'] = "EESU Dashboard Deployment Successful ($ENV)"
msg['From'] = "${{ env.ALERT_EMAIL_FROM }}"
msg['To'] = "${{ env.ALERT_EMAIL_TO }}"
msg.set_content(f"The EESU Dashboard has been successfully deployed on Leaseweb ({os.environ.get('ENV')}).")
with smtplib.SMTP("${{ env.SMTP_HOST }}", int("${{ env.SMTP_PORT }}")) as s:
    s.starttls()
    s.login("${{ env.SMTP_USER }}", "${{ env.SMTP_PASS }}")
    s.send_message(msg)
PYTHON

      # 6. Send Failure Email
      - name: Send Deployment Failure Email
        if: failure()
        run: |
          python3 - <<PYTHON
import smtplib
from email.message import EmailMessage
import os
msg = EmailMessage()
msg['Subject'] = "ALERT: EESU Dashboard Deployment Failed ($ENV)"
msg['From'] = "${{ env.ALERT_EMAIL_FROM }}"
msg['To'] = "${{ env.ALERT_EMAIL_TO }}"
msg.set_content(f"The deployment of the EESU Dashboard on Leaseweb ({os.environ.get('ENV')}) failed. Please check GitHub Actions logs for details.")
with smtplib.SMTP("${{ env.SMTP_HOST }}", int("${{ env.SMTP_PORT }}")) as s:
    s.starttls()
    s.login("${{ env.SMTP_USER }}", "${{ env.SMTP_PASS }}")
    s.send_message(msg)
PYTHON
