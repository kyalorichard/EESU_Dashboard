name: Deploy Streamlit Multi-Env on Leaseweb

on:
  push:
    branches: [ main, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - uses: actions/checkout@v3

      # 2. Detect environment
      - name: Set ENV
        run: |
          if [[ "${GITHUB_REF##*/}" == "staging" ]]; then
            echo "ENV=staging" >> $GITHUB_ENV
          else
            echo "ENV=production" >> $GITHUB_ENV

      # 3. Set server(s) and keys
      - name: Set Leaseweb server hosts
        run: |
          if [[ "$ENV" == "staging" ]]; then
            echo "SERVERS=${{ secrets.LEASEWEB_HOST_STAGING }}" >> $GITHUB_ENV
            echo "${{ secrets.LEASEWEB_KEY_STAGING }}" > leaseweb_key.pem
          else
            echo "SERVERS=${{ secrets.LEASEWEB_HOST_PROD }}" >> $GITHUB_ENV
            echo "${{ secrets.LEASEWEB_KEY_PROD }}" > leaseweb_key.pem
          fi
          chmod 600 leaseweb_key.pem

      # 4. Loop over servers and deploy
      - name: Deploy to servers
        run: |
          for SERVER in $SERVERS; do
            echo "Deploying to $SERVER"

            # Upload app folder
            rsync -avz -e "ssh -i leaseweb_key.pem -o StrictHostKeyChecking=no" \
            streamlit/ ubuntu@$SERVER:/home/ubuntu/app/

            # Backup old containers
            ssh -i leaseweb_key.pem ubuntu@$SERVER << EOF
              docker-compose -f ~/app/docker-compose.yml stop || true
              docker-compose -f ~/app/docker-compose.yml rm -f || true
              docker-compose -f ~/app/docker-compose.yml pull || true
              docker-compose -f ~/app/docker-compose.yml build
              docker-compose -f ~/app/docker-compose.yml up -d
            EOF

            # Health check
            sleep 25
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SERVER:8501)
            if [ "$STATUS" != "200" ]; then
              echo "Deploy failed on $SERVER. Rolling back..."
              ssh -i leaseweb_key.pem ubuntu@$SERVER << EOF
                docker-compose -f ~/app/docker-compose.yml down
                docker-compose -f ~/app/docker-compose.yml up -d
              EOF
              exit 1
            fi

            echo "Deployment successful on $SERVER"
          done
