name: Data pull Incremental Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      - name: Run SFTP CSV sync
        id: sftp_sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: exports
          LOCAL_DIR: data
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          set -e
          OUTPUT=$(python export_data.py)
          echo "$OUTPUT"
          NEW_FILES=$(echo "$OUTPUT" | grep NEW_FILES_DOWNLOADED | awk -F= '{print $2}' || echo "0")
          echo "NEW_FILES=$NEW_FILES" >> $GITHUB_ENV

      - name: Commit & push updated CSV files
        if: env.NEW_FILES != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff-index --quiet HEAD || git commit -m "Update CSV files [skip ci]"
          git push
