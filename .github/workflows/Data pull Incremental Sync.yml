name: Data pull Incremental Sync

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sftp_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas paramiko

      - name: Run SFTP CSV sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          LOCAL_DIR: exports

          SMTP_HOST: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL: ${{ secrets.EMAIL_TO }}
        run: python data_extraction.py

      # Critical: ensure workflow files are not modified/staged in this automation
      - name: Reset any workflow-file changes (prevent workflows push rejection)
        run: |
          git checkout -- .github/workflows || true
          git restore --staged .github/workflows || true

      - name: Debug changed files (should NOT list .github/workflows)
        run: |
          echo "Changed files:"
          git status --porcelain
          echo "Diff names:"
          git diff --name-only

      - name: Create Pull Request (commit exports changes if any)
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: csv-update
          delete-branch: true
          base: main
          title: "Automated CSV update"
          body: "This PR updates CSV files in exports/ with the latest export from SFTP."
          labels: automated
          commit-message: "Update CSV files [skip ci]"
          add-paths: |
            exports/

      - name: Auto merge PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          merge_method: squash
          pull_request_number: ${{ steps.pr.outputs.pull-request-number }}
