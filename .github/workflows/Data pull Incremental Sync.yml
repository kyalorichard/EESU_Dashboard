name: Data pull Incremental Sync

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      # 4️⃣ Run SFTP CSV incremental sync
      - name: Run SFTP CSV sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: exports
          LOCAL_DIR: data
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python export_data.py

      # 5️⃣ Debug: show staged CSV files
      - name: Show staged CSV files
        run: |
          echo "Files in data/ folder:"
          ls -la data/
          echo "Git sees these files for commit:"
          git status

      # 6️⃣ Commit & push updated CSV files
      - name: Commit and push updates
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN_CUSTOM }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/
          git diff-index --cached --quiet HEAD || git commit -m "Update CSV files [skip ci]"
          git diff-index --cached --quiet HEAD || git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:main
