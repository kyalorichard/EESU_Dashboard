name: Data pull Incremental Sync
on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 06:00 UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  sftp_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas paramiko

      - name: Run SFTP CSV sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          LOCAL_DIR: data
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python data_extraction.py

      - name: Exit if no new CSV
        if: env.NEW_FILES_DOWNLOADED == '0'
        run: |
          echo "No new CSV file detected. Exiting workflow."
          exit 0

      - name: Commit & push to temp branch
        id: commit_push
        env:
          GIT_TOKEN_CUSTOM: ${{ secrets.GIT_TOKEN_CUSTOM }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          BRANCH_NAME="csv-update-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git add -A data/
          git commit -m "Update CSV files [skip ci]"
          git push https://$GIT_TOKEN_CUSTOM@github.com/${{ github.repository }} HEAD:$BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          branch: ${{ steps.commit_push.outputs.branch_name }}
          base: main
          title: "Automated CSV update"
          body: "This PR updates raw_data.csv with the latest CSV from SFTP."
          labels: automated
          commit-message: "Update CSV files [skip ci]"

      - name: Auto merge PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: "pascalgn/automerge-action@v0.15.0"
        with:
          github_token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          merge_method: squash
          pull_request_number: ${{ steps.pr.outputs.pull-request-number }}
