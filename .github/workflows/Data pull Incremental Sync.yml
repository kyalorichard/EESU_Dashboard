name: Data pull Incremental Sync

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      # 4️⃣ Run SFTP CSV sync
      - name: Run SFTP CSV sync
        id: sftp_sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: exports
          LOCAL_DIR: data
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_ENV: ${{ github.env }}
        run: |
          set -e
          python export_data.py

      # 5️⃣ Exit early if no new CSV
      - name: Exit if no new CSV
        if: env.NEW_FILES_DOWNLOADED == '0'
        run: |
          echo "No new CSV file detected. Exiting workflow."
          exit 0

      # 6️⃣ Commit & push updates using PAT
      - name: Commit & push to temp branch
        id: commit_push
        env:
          GIT_TOKEN_CUSTOM: ${{ secrets.GIT_TOKEN_CUSTOM }}
        run: |
          set -e

          # Clear old cached credentials
          git credential-cache exit || true
          git config --global --unset credential.helper || true

          # Configure Git user
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # Create a temporary branch
          BRANCH_NAME="csv-update-$(date +%s)"
          git checkout -b $BRANCH_NAME

          # Add and commit changes
          git add -A data/
          git commit -m "Update CSV files [skip ci]"

          # Set remote URL with PAT
          git remote set-url origin https://$GIT_TOKEN_CUSTOM@github.com/${{ github.repository }}

          # Push temporary branch to origin
          git push origin HEAD:$BRANCH_NAME

          # Expose branch name for PR creation
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      # 7️⃣ Create Pull Request to main
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          branch: ${{ steps.commit_push.outputs.branch_name }}
          base: main
          title: "Automated CSV update"
          body: "This PR updates raw_data.csv with the latest CSV from SFTP."
          labels: automated
          commit-message: "Update CSV files [skip ci]"
