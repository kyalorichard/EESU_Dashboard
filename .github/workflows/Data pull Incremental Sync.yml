name: Data pull Incremental Sync

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko

      # 4️⃣ Run SFTP CSV sync
      - name: Run SFTP CSV sync
        id: sftp_sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: exports
          LOCAL_DIR: data
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          set -e
          NEW_FILES_DOWNLOADED=$(python export_data.py | grep NEW_FILES_DOWNLOADED | awk -F= '{print $2}')
          echo "NEW_FILES_DOWNLOADED=$NEW_FILES_DOWNLOADED" >> $GITHUB_ENV

      # 5️⃣ Commit & push updates to a temp branch if new files exist
      - name: Commit & push updated CSV files
        if: env.NEW_FILES_DOWNLOADED == '1'
        env:
          GIT_TOKEN_CUSTOM: ${{ secrets.GIT_TOKEN_CUSTOM }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # Create a temporary branch with timestamp
          BRANCH_NAME="csv-update-$(date +%s)"
          git checkout -b $BRANCH_NAME

          git add -A data/

          git commit -m "Update CSV files [skip ci]"

          echo "Pushing to temporary branch $BRANCH_NAME..."
          git push https://x-access-token:${GIT_TOKEN_CUSTOM}@github.com/${{ github.repository }} HEAD:$BRANCH_NAME

      # 6️⃣ Create Pull Request using GitHub CLI
      - name: Create Pull Request to main
        if: env.NEW_FILES_DOWNLOADED == '1'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          commit-message: "Update CSV files [skip ci]"
          branch: ${{ steps.sftp_sync.outputs.branch_name || 'csv-update-temp' }}
          base: main
          title: "Automated CSV update"
          body: "This PR updates raw_data.csv with the latest CSV from SFTP."
          labels: automated
