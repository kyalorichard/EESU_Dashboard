name: Data pull Incremental Sync

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch:

# Required for pushing commits and opening PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  sftp_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use PAT if you want PR/merge to work reliably
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas paramiko

      - name: Run SFTP CSV sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          LOCAL_DIR: export

          # Align these to what your script reads
          SMTP_HOST: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p export
          python data_extraction.py

      - name: Exit if no new CSV
        if: env.NEW_FILES_DOWNLOADED == '0'
        run: |
          echo "No new CSV file detected. Exiting workflow."
          exit 0

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          base: main
          branch: automated/csv-update
          delete-branch: true
          title: "Automated CSV update"
          body: "This PR updates CSV files from SFTP sync."
          labels: automated
          commit-message: "Update CSV files [skip ci]"
          add-paths: |
            export/

      # Optional auto-merge (repo must allow auto-merge; PAT must have rights)
      - name: Enable auto-merge (squash)
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN_CUSTOM }}
