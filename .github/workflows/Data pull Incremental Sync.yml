name: Data pull Incremental Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sftp_sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas paramiko

      - name: Run SFTP CSV sync
        id: sync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          LOCAL_DIR: exports
          SMTP_HOST: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL: ${{ secrets.EMAIL_TO }}
        run: |
          mkdir -p exports
          python data_extraction.py

          if git status --porcelain exports/ | grep .; then
            echo "new_files=1" >> $GITHUB_OUTPUT
          else
            echo "new_files=0" >> $GITHUB_OUTPUT
          fi

      - name: Exit if no new CSV
        if: steps.sync.outputs.new_files == '0'
        run: |
          echo "No new CSV file detected. Exiting workflow."

      - name: Create Pull Request
        id: cpr
        if: steps.sync.outputs.new_files == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GIT_TOKEN_CUSTOM }}
          base: main
          branch: automated/csv-update
          delete-branch: true
          title: "Automated CSV update"
          body: "This PR updates CSV files from SFTP sync."
          labels: automated
          commit-message: "Update CSV files [skip ci]"
          add-paths: |
            exports/

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN_CUSTOM }}
