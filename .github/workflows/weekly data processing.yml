name: Weekly EESU Data Processing

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  run-processing:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: exports
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
      LOCAL_DIR: exports

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment variables
        run: |
          python - <<'PY'
          import os
          print("OPENAI_API_KEY exists:", bool(os.getenv("OPENAI_API_KEY")))
          print("OPENAI_API_KEY length:", len(os.getenv("OPENAI_API_KEY", "")))
          print("OPENAI_API_KEY starts sk:", os.getenv("OPENAI_API_KEY", "").startswith("sk-"))
          print("SFTP_REMOTE_DIR exists:", bool(os.getenv("SFTP_REMOTE_DIR")))
          print("SFTP_HOST exists:", bool(os.getenv("SFTP_HOST")))
          print("SFTP_USERNAME exists:", bool(os.getenv("SFTP_USERNAME")))
          print("SFTP_PASSWORD exists:", bool(os.getenv("SFTP_PASSWORD")))
          PY

      - name: Test OpenAI connectivity
        run: |
          python - <<'PY'
          import os, sys
          import openai
      
          key = os.getenv("OPENAI_API_KEY", "")
          print("Key present:", bool(key))
          print("Starts with sk-:", key.startswith("sk-"))
          print("Length:", len(key))
      
          openai.api_key = key
      
          try:
              resp = openai.chat.completions.create(
                  model=os.getenv("OPENAI_MODEL", "gpt-5-mini"),
                  messages=[{"role": "user", "content": "Say OK"}],
              )
              print("OpenAI OK:", resp.choices[0].message.content[:20])
          except Exception as e:
              print("OpenAI ERROR:", e)
              sys.exit(1)
          PY

      - name: Run EESU data processing
        run: python data_preprocessing.py
