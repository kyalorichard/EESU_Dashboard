name: Weekly EESU Data Processing

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  run-processing:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: exports
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      REMOTE_DIR: ${{ secrets.REMOTE_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment variables
        run: |
          python - <<'PY'
          import os
          print("OPENAI_API_KEY exists:", bool(os.getenv("OPENAI_API_KEY")))
          print("SMTP_HOST exists:", bool(os.getenv("SMTP_HOST")))
          print("NOTIFY_EMAIL exists:", bool(os.getenv("NOTIFY_EMAIL")))
          print("SFTP_HOST exists:", bool(os.getenv("SFTP_HOST")))
          PY

      - name: Run EESU data processing
        run: python data_preprocessing.py
