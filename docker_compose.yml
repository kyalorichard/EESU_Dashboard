services:
  eese-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: kyalorichard11/eesu-dashboard:latest
    container_name: eese-dashboard
    ports:
      - "8501:8501"
    volumes:
      - /var/www/vhosts/events-eusee.hivos.org/exports:/exports
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      # Uncomment if SFTP is needed
      # SFTP_HOST: your-sftp-host.com
      # SFTP_USERNAME: your-username
      # SFTP_PASSWORD: your-password
    restart: unless-stopped
