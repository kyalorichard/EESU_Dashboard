version: "3.9"

services:
  dashboard:
    image: kyalorichard11/eesu-dashboard:latest
    container_name: eusee_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data # maps your local 'data' folder
    environment:
      - IS_STREAMLIT_CLOUD=False
    restart: unless-stopped
